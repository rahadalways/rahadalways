  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e11" />
      <stop offset="50%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#2a2a2e" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#1b1b1f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.3" />
    </linearGradient>
    <clipPath id="revealWipe">
      <rect x="0" y="0" width="370" height="0">
        <animate attributeName="height" from="0" to="490" dur="1.4s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes fin {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ascii-line {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 8.6px;
      font-weight: 600;
      letter-spacing: 1.8px;
      fill: #D4AF37;
      text-shadow: 0 0 4px rgba(212, 175, 55, 0.35);
      white-space: pre;
    }
    .terminal-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      fill: #10b981;
    }
    .footer-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #6e7681;
      letter-spacing: 0.5px;
    }
