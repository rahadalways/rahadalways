name: Update Profile Art & Heatmap

on:
  schedule:
    # Daily at 06:17 UTC
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements-ci.txt

      - name: Fetch GitHub Contributions
        run: |
          python scripts/fetch_contributions.py rahadalways data/contributions.json

      - name: Render Contribution Heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py data/contributions.json contrib-heatmap.svg

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg data/contributions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update contribution heatmap [skip ci]" && git push)
